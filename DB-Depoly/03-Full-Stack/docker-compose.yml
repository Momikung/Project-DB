version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: ps09_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root*
      POSTGRES_DB: DB_project
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ../../mysql:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: ps09_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: ../../backend
    container_name: ps09_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: root*
      DB_NAME: DB_project
    depends_on:
      - db

  frontend:
    build: ../../frontend
    container_name: ps09_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:

  db_data:
